site_name: enMAAS Mini
site_description: >-
  Experimental Praxis and PriceTag model-gateway deployment guides.
site_url: https://redhat-et.github.io/enmaas-mini/
repo_url: https://github.com/redhat-et/enmaas-mini
repo_name: redhat-et/enmaas-mini
edit_uri: edit/main/
copyright: Experimental demonstration, not a production-ready platform.

docs_dir: .docs-build
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/images/redhat-fedora-white.svg
  favicon: assets/images/redhat-favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: README.md
  - Start here:
      - Introduction: docs/README.md
      - Architecture overview: docs/quickstarts/architecture-walkthrough/README.md
  - Deployment:
      - Deployment methods: docs/deployment-methods.md
      - Common gateway configuration:
          - Overview: docs/quickstarts/common/README.md
          - Harness configuration: docs/quickstarts/common/harness-configuration.md
          - Provider setup: docs/quickstarts/common/providers.md
          - Token quota reference: docs/quickstarts/common/token-quotas.md
      - All-in-one gateway:
          - Overview: docs/quickstarts/all-in-one/README.md
          - In-memory deployment: docs/quickstarts/all-in-one/in-memory.md
          - Valkey deployment: docs/quickstarts/all-in-one/valkey.md
          - Switchyard deployment: docs/quickstarts/all-in-one/switchyard.md
          - Create a user login: docs/quickstarts/all-in-one/accounts.md
          - User setup and usage: docs/quickstarts/all-in-one/users.md
      - Remote HTTPS/JWT gateway:
          - Overview: docs/quickstarts/remote-gateway/README.md
          - Install: docs/quickstarts/remote-gateway/install.md
          - User setup: docs/quickstarts/remote-gateway/users.md
      - Optional vLLM inference:
          - Mutable RHEL deployment: docs/quickstarts/common/vllm.md
          - Bootc image deployment: bootc/VLLM.md
      - Remote gateway with PriceTag:
          - Choose deployment and installer mode: docs/quickstarts/remote-gateway-pricetag/deployment-options.md
          - One-node installation: docs/quickstarts/remote-gateway-pricetag/README.md
          - Full deployment with SSO and observability: docs/quickstarts/remote-gateway-pricetag/full-deployment.md
          - Architecture and OpenShift comparison: docs/quickstarts/remote-gateway-pricetag/architecture.md
          - Manual installation: docs/quickstarts/remote-gateway-pricetag/manual.md
          - External PostgreSQL databases: docs/quickstarts/remote-gateway-pricetag/external-database.md
          - Providers and models: docs/quickstarts/remote-gateway-pricetag/providers.md
          - Users, keys and budgets: docs/quickstarts/remote-gateway-pricetag/users.md
          - OpenCode CLI and desktop: docs/quickstarts/remote-gateway-pricetag/clients.md
          - Model prices and discounts: docs/quickstarts/remote-gateway-pricetag/pricing.md
          - UI demo walkthrough: docs/quickstarts/remote-gateway-pricetag/demo.md
          - Management CLI and API: docs/quickstarts/remote-gateway-pricetag/management-api.md
          - Image options: docs/quickstarts/remote-gateway-pricetag/images.md
          - Pilot limits and qualification: docs/testing/pricetag.md
          - AWS deployment runbook: docs/testing/aws-pricetag.md
          - Performance procedure: docs/testing/pricetag-perf.md
  - Examples:
      - Overview: docs/examples/README.md
      - Praxis token quotas: docs/examples/praxis-quotas/README.md
  - Development:
      - Documentation site: docs/development/documentation-site.md
      - MaaS and PriceTag image publication: docs/development/pricetag-images.md
      - PriceTag gateway routing: docs/development/pricetag-routing.md
  - Testing:
      - Testing guide: docs/testing/README.md
      - Mock provider tests: docs/testing/mocked-provider.md
      - AWS VM runbook: docs/testing/aws.md
      - AWS operations: docs/testing/aws-operations.md
      - Full-deployment testing:
          - Overview: docs/testing/external-services/README.md
          - Nodes and collectors: docs/testing/external-services/topology.md
          - Local Podman:
              - Setup and tests: docs/testing/external-services/local-podman.md
              - Open dashboards: docs/testing/external-services/local-dashboards.md
          - AWS test infrastructure:
              - Three-node provisioning: docs/testing/external-services/aws.md
              - Optional RDS: docs/testing/external-services/rds.md
          - RHEL service installation:
              - Headless installation: docs/testing/external-services/headless.md
              - Certificates: docs/testing/external-services/certificates.md
              - Peer networking: docs/testing/external-services/network.md
              - Optional DNS: docs/testing/external-services/dns.md
              - Keycloak node: docs/testing/external-services/keycloak-rhel.md
              - Observability node: docs/testing/external-services/observability-rhel.md
              - Gateway telemetry agent: docs/testing/external-services/gateway-telemetry.md
              - SSO and identities: docs/testing/external-services/oidc.md
              - Providers: docs/testing/external-services/providers.md
          - Qualification and cleanup:
              - Security acceptance: docs/testing/external-services/security-acceptance.md
              - Benchmark: docs/testing/external-services/benchmark.md
              - Reports: docs/testing/external-services/report.md
              - Detailed design: docs/testing/external-services/design.md
              - Cleanup: docs/testing/external-services/cleanup.md

extra_css:
  - assets/stylesheets/redhat.css

not_in_nav: |
  bootc/README.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - callouts

hooks:
  - scripts/docs/mkdocs_hooks.py

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/redhat-et/enmaas-mini
      name: enMAAS Mini on GitHub
