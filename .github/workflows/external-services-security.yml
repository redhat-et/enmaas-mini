name: External-services security runtime

on:
  pull_request:
    paths:
      - '.github/workflows/external-services-security.yml'
      - 'tests/external-services/**'
      - 'scripts/pricetag/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/external-services-security.yml'
      - 'tests/external-services/**'
      - 'scripts/pricetag/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-services-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Isolated issuer and collector security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman python3-yaml openssl
      - name: Test pinned identity and collector images
        run: sudo python3 tests/external-services/security-runtime.py
