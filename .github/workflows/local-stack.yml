name: Local stack qualification

on:
  pull_request:
    paths:
      - 'tests/external-services/**'
      - 'tests/common/provider.py'
      - 'scripts/pricetag/**'
      - '.github/workflows/local-stack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml openssl
          python3 -m unittest discover -s tests/external-services/unit
          python3 tests/pricetag/install.py
          python3 tests/pricetag/install-orchestration.py

  runtime:
    # Full builds and services run explicitly; PRs always run the contracts above.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ENMAAS_LAB_INSTANCE: external-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tools and browser
        run: |
          sudo apt-get update
          sudo apt-get install -y podman apparmor-utils python3-yaml openssl
          npm ci --prefix tests/pricetag/browser --ignore-scripts
          sudo tests/pricetag/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Configure confined CI container profile
        run: |
          sudo apparmor_parser --replace tests/pricetag/ci.apparmor
          sudo install -d -m 0755 /etc/containers/containers.conf.d
          printf '[containers]\napparmor_profile="pricetag-demo-ci"\n' | sudo tee /etc/containers/containers.conf.d/99-pricetag-demo.conf >/dev/null
      - name: Build reviewed application sources
        run: |
          git init "$RUNNER_TEMP/metering"
          git -C "$RUNNER_TEMP/metering" fetch --depth 1 https://github.com/Ladas/pricetag-metering.git 2281e1a84bfc3b998e7db36bc01bae88130bfcdd
          git -C "$RUNNER_TEMP/metering" checkout --detach FETCH_HEAD
          sudo python3 scripts/pricetag/build-metering --source "$RUNNER_TEMP/metering"
          git init "$RUNNER_TEMP/maas"
          git -C "$RUNNER_TEMP/maas" fetch --depth 1 https://github.com/Ladas/models-as-a-service.git 6ac4c80ebc95f590e5f24593ac15bb80c7f9fa1d
          git -C "$RUNNER_TEMP/maas" checkout --detach FETCH_HEAD
          sudo scripts/pricetag/build-maas --source "$RUNNER_TEMP/maas" --expected-commit 6ac4c80ebc95f590e5f24593ac15bb80c7f9fa1d
      - name: Qualify isolated local stack
        run: sudo env ENMAAS_LAB_INSTANCE=external-ci python3 tests/external-services/local-qualification.py
      - name: Remove only owned containers and secrets
        if: always()
        run: sudo env ENMAAS_LAB_INSTANCE=external-ci python3 tests/external-services/local.py down
