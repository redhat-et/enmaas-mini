name: Build standalone MaaS and PriceTag images

on:
  pull_request:
    paths:
      - .github/workflows/pricetag-images.yml
      - configs/pricetag/Containerfile.metering
      - scripts/pricetag/build-maas
      - scripts/pricetag/build-metering
      - tests/pricetag/component-images.py
  push:
    branches: [main]
    paths:
      - .github/workflows/pricetag-images.yml
      - configs/pricetag/Containerfile.metering
      - scripts/pricetag/build-maas
      - scripts/pricetag/build-metering
      - tests/pricetag/component-images.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricetag-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    # Quay credentials are environment secrets, as in the bootc publisher.
    environment: ${{ github.repository == 'redhat-et/enmaas-mini' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'bootc-image-main' || 'bootc-image-pr' }}
    timeout-minutes: 60
    env:
      MAAS_REVISION: 6ac4c80ebc95f590e5f24593ac15bb80c7f9fa1d
      # Metering builds from the standalone-management branch carrying
      # redhat-et/pricetag-metering PR #149 (redhat-et main plus the
      # standalone management layer). Follow main once that pull request
      # merges.
      METERING_REVISION: aefcacd2643d54bd7e4b915c6afac2ca8cc8716a
      MAAS_IMAGE: quay.io/redhat-et/secure-single-server-maas-standalone
      METERING_IMAGE: quay.io/redhat-et/secure-single-server-pricetag-metering
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman python3
      - name: Fetch pinned application sources
        shell: bash
        run: |
          set -euo pipefail
          for component in maas metering; do
            directory="${RUNNER_TEMP}/${component}-source"
            git init "$directory"
            if [[ "$component" == maas ]]; then
              git -C "$directory" remote add origin https://github.com/Ladas/models-as-a-service.git
              git -C "$directory" fetch --depth=1 origin "$MAAS_REVISION"
              git -C "$directory" checkout --detach FETCH_HEAD
              test "$(git -C "$directory" rev-parse HEAD)" = "$MAAS_REVISION"
            else
              # Fetch the immutable pinned commit from the canonical repository.
              # While PR #149 is open, the standalone-management branch of
              # redhat-et/pricetag-metering carries this commit and keeps it
              # reachable; the pin follows main once the pull request merges.
              git -C "$directory" remote add origin https://github.com/redhat-et/pricetag-metering.git
              if ! git -C "$directory" fetch --depth=1 origin "$METERING_REVISION"; then
                echo "::error::metering revision $METERING_REVISION is not reachable in redhat-et/pricetag-metering; update the pin to a commit carried by main or the PR branch" >&2
                exit 1
              fi
              git -C "$directory" checkout --detach FETCH_HEAD
              test "$(git -C "$directory" rev-parse HEAD)" = "$METERING_REVISION"
            fi
          done
      - name: Build pinned amd64 images
        run: |
          set -euo pipefail
          sudo scripts/pricetag/build-maas --source "${RUNNER_TEMP}/maas-source" \
            --expected-commit "$MAAS_REVISION" --platform linux/amd64 --tag localhost/maas:ci
          sudo python3 scripts/pricetag/build-metering --source "${RUNNER_TEMP}/metering-source" \
            --platform linux/amd64 --revision "$METERING_REVISION" --tag localhost/metering:ci
          test "$(sudo podman image inspect localhost/maas:ci --format '{{index .Labels "org.opencontainers.image.revision"}}')" = "$MAAS_REVISION"
          test "$(sudo podman image inspect localhost/metering:ci --format '{{index .Labels "org.opencontainers.image.revision"}}')" = "$METERING_REVISION"
          for image in localhost/maas:ci localhost/metering:ci; do
            test "$(sudo podman image inspect "$image" --format '{{.Architecture}}')" = amd64
          done
      - name: Test both services with PostgreSQL
        run: sudo python3 tests/pricetag/component-images.py --maas-image localhost/maas:ci --metering-image localhost/metering:ci
      - name: Publish tested images
        if: github.repository == 'redhat-et/enmaas-mini' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUAY_USERNAME"
          test -n "$QUAY_TOKEN"
          authfile="$(mktemp "${RUNNER_TEMP}/pricetag-auth.XXXXXX")"
          trap 'rm -f "$authfile"' EXIT
          printf '{}\n' > "$authfile"
          printf '%s' "$QUAY_TOKEN" | sudo podman login --authfile "$authfile" \
            --username "$QUAY_USERNAME" --password-stdin quay.io
          for component in maas metering; do
            if [[ "$component" == maas ]]; then repository="$MAAS_IMAGE"; else repository="$METERING_IMAGE"; fi
            tag="sha-${GITHUB_SHA}"
            digestfile="${RUNNER_TEMP}/${component}.digest"
            sudo podman push --authfile "$authfile" --digestfile "$digestfile" \
              "localhost/${component}:ci" "docker://${repository}:${tag}"
            digest="$(sudo cat "$digestfile")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s\n' "- ${repository}@${digest} (linux/amd64; tag ${tag})" >> "$GITHUB_STEP_SUMMARY"
          done
