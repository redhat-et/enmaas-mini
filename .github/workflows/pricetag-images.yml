name: Build standalone PriceTag metering image

on:
  pull_request:
    paths:
      - .github/workflows/pricetag-images.yml
      - configs/pricetag/Containerfile.metering
      - scripts/pricetag/build-metering
      - tests/pricetag/component-images.py
  push:
    branches: [main]
    paths:
      - .github/workflows/pricetag-images.yml
      - configs/pricetag/Containerfile.metering
      - scripts/pricetag/build-metering
      - tests/pricetag/component-images.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricetag-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    # Quay credentials are environment secrets, as in the bootc publisher.
    environment: ${{ github.repository == 'redhat-et/enmaas-mini' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'bootc-image-main' || 'bootc-image-pr' }}
    timeout-minutes: 60
    env:
      # Metering builds from the pinned revision of redhat-et/pricetag-metering;
      # main has carried it since PR #149 merged. MaaS is no longer built here:
      # the installer pins the published quay.io/redhat-et/enmaas-api image.
      METERING_REVISION: e4ba826d5b1469d7f1167428792e498ffb4d92c7
      METERING_IMAGE: quay.io/redhat-et/secure-single-server-pricetag-metering
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman python3
      - name: Fetch pinned metering source
        shell: bash
        run: |
          set -euo pipefail
          directory="${RUNNER_TEMP}/metering-source"
          git init "$directory"
          # Fetch the immutable pinned commit from the canonical repository;
          # main has carried it since PR #149 merged.
          git -C "$directory" remote add origin https://github.com/redhat-et/pricetag-metering.git
          if ! git -C "$directory" fetch --depth=1 origin "$METERING_REVISION"; then
            echo "::error::metering revision $METERING_REVISION is not reachable in redhat-et/pricetag-metering; update the pin to a commit carried by main or the PR branch" >&2
            exit 1
          fi
          git -C "$directory" checkout --detach FETCH_HEAD
          test "$(git -C "$directory" rev-parse HEAD)" = "$METERING_REVISION"
      - name: Build pinned amd64 metering image
        run: |
          set -euo pipefail
          sudo python3 scripts/pricetag/build-metering --source "${RUNNER_TEMP}/metering-source" \
            --platform linux/amd64 --revision "$METERING_REVISION" --tag localhost/metering:ci
          test "$(sudo podman image inspect localhost/metering:ci --format '{{index .Labels "org.opencontainers.image.revision"}}')" = "$METERING_REVISION"
          test "$(sudo podman image inspect localhost/metering:ci --format '{{.Architecture}}')" = amd64
      - name: Test the metering image with the pinned MaaS image and PostgreSQL
        run: |
          set -euo pipefail
          # The MaaS digest is pinned visibly in this workflow and compared
          # textually against the installer constant — no repository Python
          # is imported — so CI fails rather than silently following an
          # install.py change that points at a different digest.
          maas=quay.io/redhat-et/enmaas-api@sha256:fb8e02ab32223ca91507b112e8aa21b5281445100c7ce2023d06065c70a3ac82
          grep -qF "PUBLISHED_MAAS_IMAGE = '$maas'" scripts/pricetag/install.py
          sudo podman pull "$maas"
          # Mirror the metering image's checks: the MaaS digest must resolve
          # to the linux/amd64 image this job builds and tests against.
          test "$(sudo podman image inspect "$maas" --format '{{.Architecture}}')" = amd64
          sudo python3 tests/pricetag/component-images.py --maas-image "$maas" --metering-image localhost/metering:ci
      - name: Publish tested metering image
        if: github.repository == 'redhat-et/enmaas-mini' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUAY_USERNAME"
          test -n "$QUAY_TOKEN"
          authfile="$(mktemp "${RUNNER_TEMP}/pricetag-auth.XXXXXX")"
          trap 'rm -f "$authfile"' EXIT
          printf '{}\n' > "$authfile"
          printf '%s' "$QUAY_TOKEN" | sudo podman login --authfile "$authfile" \
            --username "$QUAY_USERNAME" --password-stdin quay.io
          tag="sha-${GITHUB_SHA}"
          digestfile="${RUNNER_TEMP}/metering.digest"
          sudo podman push --authfile "$authfile" --digestfile "$digestfile" \
            "localhost/metering:ci" "docker://${METERING_IMAGE}:${tag}"
          digest="$(sudo cat "$digestfile")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "- ${METERING_IMAGE}@${digest} (linux/amd64; tag ${tag})" >> "$GITHUB_STEP_SUMMARY"
