name: PriceTag demo deployment

on:
  pull_request:
    paths:
      - '.github/workflows/pricetag-demo.yml'
      - 'scripts/pricetag/**'
      - 'scripts/common/**'
      - 'scripts/remote-gateway/**'
      - 'configs/pricetag/**'
      - 'tests/pricetag/**'
      - 'tests/common/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pricetag-demo.yml'
      - 'scripts/pricetag/**'
      - 'scripts/common/**'
      - 'scripts/remote-gateway/**'
      - 'configs/pricetag/**'
      - 'tests/pricetag/**'
      - 'tests/common/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricetag-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Mock gateway API and browser demo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y podman apparmor-utils python3-yaml openssl curl ruby
          python3 tests/pricetag/container-demo-test.py
          node tests/pricetag/mock-guard.test.cjs
          node tests/pricetag/management-users.test.cjs
          npm ci --prefix tests/pricetag/browser --ignore-scripts
          # Chromium's system libraries need root; the browser itself is
          # installed unprivileged into a shared cache so external test code
          # never has to run as root to reach it.
          sudo tests/pricetag/browser/node_modules/.bin/playwright install-deps chromium
          tests/pricetag/browser/node_modules/.bin/playwright install chromium
      - name: Configure confined CI container profile
        run: |
          sudo apparmor_parser --replace tests/pricetag/ci.apparmor
          sudo install -d -m 0755 /etc/containers/containers.conf.d
          printf '[containers]\napparmor_profile="pricetag-demo-ci"\n' | sudo tee /etc/containers/containers.conf.d/99-pricetag-demo.conf >/dev/null
      - name: Pre-pull the pinned PostgreSQL image
        run: |
          # registry.access.redhat.com intermittently answers anonymous blob
          # fetches with unauthorized errors from CI egress; retry so a
          # transient rejection cannot fail the job (re-running also works).
          image=$(python3 -c "import sys; sys.path.insert(0, 'scripts/pricetag'); import prepare; print(prepare.POSTGRES)")
          for attempt in 1 2 3 4 5; do
            if sudo timeout 300 podman pull "$image"; then
              exit 0
            fi
            echo "::warning::pull attempt $attempt failed for $image" >&2
            sleep $((attempt * 60))
          done
          echo "::error::could not pull $image after retries" >&2
          exit 1
      - name: Qualify isolated PostgreSQL runtime
        run: sudo python3 tests/pricetag/database-smoke.py
      - name: Validate external database connections and permissions
        run: sudo python3 tests/pricetag/external-database.py
      - name: Build metering source and pull pinned published images
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          set -euo pipefail
          # Independent of private registries or provider credentials. Use the
          # reviewed metering source candidate, independently of published
          # image digests. redhat-et/pricetag-metering PR #149 merged; main
          # now carries the pinned revision, so the immutable SHA fetch no
          # longer depends on the PR branch staying alive.
          metering=e4ba826d5b1469d7f1167428792e498ffb4d92c7
          directory="$RUNNER_TEMP/metering"
          git init "$directory"
          # Fetch the immutable pinned commit from the canonical repository.
          git -C "$directory" remote add origin https://github.com/redhat-et/pricetag-metering.git
          if ! git -C "$directory" fetch --depth=1 origin "$metering"; then
            echo "::error::metering revision $metering is not reachable in redhat-et/pricetag-metering; update the pin to a commit carried by main or the PR branch" >&2
            exit 1
          fi
          git -C "$directory" checkout --detach FETCH_HEAD
          test "$(git -C "$directory" rev-parse HEAD)" = "$metering"
          # The metering checkout is external code: run its UI tests inside the
          # digest-pinned Playwright image (the same version this repository
          # pins in tests/pricetag/browser/package.json), with the checkout and
          # this repository's node_modules mounted read-only, a non-root user
          # and a writable tmpfs, so nothing from the upstream commit can
          # touch the runner outside a confined container. Only the
          # podman-driven build steps below need root.
          metering_ui=mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
          # The .test.cjs files are pure node:test/node:vm suites with no
          # playwright import, so they need neither the node_modules mount
          # nor NODE_PATH; only the browser scripts below resolve playwright.
          # Every invocation runs with --network none: the suites exercise
          # local fixtures only (loopback stays available), so the external
          # code has no outbound network path from the runner.
          sudo podman run --rm --read-only --network none --cap-drop all --security-opt no-new-privileges \
            --user 1000 --tmpfs /tmp:rw,size=512m \
            -v "$RUNNER_TEMP/metering:/work:ro,Z" -w /work \
            "$metering_ui" node --test tests/ui/key-controls.test.cjs tests/ui/table-controls.test.cjs
          for script in table-browser session-dialog-browser; do
            # Fail loudly if the playwright package stops resolving; the
            # scripts themselves exit zero with a SKIP when it is missing.
            # PLAYWRIGHT_BROWSERS_PATH=/ms-playwright restates the Playwright
            # image's own environment default, pointing the repository's
            # mounted playwright package at the browsers baked into the image
            # (the pinned image matches the repository's playwright version).
            sudo podman run --rm --read-only --network none --cap-drop all --security-opt no-new-privileges \
              --user 1000 --tmpfs /tmp:rw,size=512m \
              -v "$RUNNER_TEMP/metering:/work:ro,Z" \
              -v "$GITHUB_WORKSPACE/tests/pricetag/browser/node_modules:/node_modules:ro,Z" \
              -w /work -e NODE_PATH=/node_modules -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
              "$metering_ui" node -e "require('playwright')"
            sudo podman run --rm --read-only --network none --cap-drop all --security-opt no-new-privileges \
              --user 1000 --tmpfs /tmp:rw,size=512m \
              -v "$RUNNER_TEMP/metering:/work:ro,Z" \
              -v "$GITHUB_WORKSPACE/tests/pricetag/browser/node_modules:/node_modules:ro,Z" \
              -w /work -e NODE_PATH=/node_modules -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
              "$metering_ui" node "tests/ui/$script.cjs"
          done
          sudo python3 tests/pricetag/metering-unit.py --source "$RUNNER_TEMP/metering"
          sudo python3 scripts/pricetag/build-metering --source "$RUNNER_TEMP/metering" --revision "$metering" --tag localhost/metering:demo-ci
          # MaaS is always the published enmaas-api image and Praxis is the
          # public redhat-et mirror. Both digests are pinned here, visibly
          # and immutably in this workflow, and compared textually against
          # the installer constants: CI fails rather than silently following
          # an install.py change that points at a different digest, and no
          # repository Python is imported to perform the comparison.
          maas=quay.io/redhat-et/enmaas-api@sha256:fb8e02ab32223ca91507b112e8aa21b5281445100c7ce2023d06065c70a3ac82
          praxis=quay.io/redhat-et/praxis-ai@sha256:240bcdaa73f4ca81a670dc0451db3072aa5190eca71f2af13c5ddfb75e49abdc
          grep -qF "PUBLISHED_MAAS_IMAGE = '$maas'" scripts/pricetag/install.py
          grep -qF "PRAXIS_IMAGE = '$praxis'" scripts/pricetag/install.py
          sudo podman pull "$maas"
          sudo podman pull "$praxis"
          # Both pins are linux/amd64 images; assert the pulled manifests
          # match, so a future pin bump to a different architecture fails
          # here with a clear error instead of inside the deployment below
          # (mirroring the images workflow's MaaS architecture check).
          test "$(sudo podman image inspect "$maas" --format '{{.Architecture}}')" = amd64
          test "$(sudo podman image inspect "$praxis" --format '{{.Architecture}}')" = amd64
      - name: Deploy and test the demo with mock inference
        run: |
          # The same digest pins as the previous step, restated visibly here:
          # step-local shell variables cannot be rewritten by earlier steps,
          # and the textual comparisons fail at the point of use if the
          # installer constants drift from the workflow pins.
          maas=quay.io/redhat-et/enmaas-api@sha256:fb8e02ab32223ca91507b112e8aa21b5281445100c7ce2023d06065c70a3ac82
          praxis=quay.io/redhat-et/praxis-ai@sha256:240bcdaa73f4ca81a670dc0451db3072aa5190eca71f2af13c5ddfb75e49abdc
          grep -qF "PUBLISHED_MAAS_IMAGE = '$maas'" scripts/pricetag/install.py
          grep -qF "PRAXIS_IMAGE = '$praxis'" scripts/pricetag/install.py
          sudo env PRAXIS_IMAGE="$praxis" \
            python3 tests/pricetag/routing-image.py
          sudo env PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" \
            python3 tests/pricetag/container-demo.py \
            --maas-image "$maas" \
            --metering-image localhost/metering:demo-ci \
            --praxis-image "$praxis" \
            --node-modules "$PWD/tests/pricetag/browser/node_modules" \
            --output "$RUNNER_TEMP/pricetag-demo"
      - name: Collect sanitized results
        if: always()
        run: |
          mkdir -p evidence/pricetag-demo
          for name in results failure; do
            if sudo test -f "$RUNNER_TEMP/pricetag-demo/$name.json"; then
              sudo cat "$RUNNER_TEMP/pricetag-demo/$name.json" | tee "evidence/pricetag-demo/$name.json" >/dev/null
            fi
          done
      - name: Upload assertion results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pricetag-demo-results
          path: evidence/pricetag-demo/*.json
          if-no-files-found: warn
          retention-days: 7
